<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="col-md-4">
<div class="card p-4 shadow rounded-4">

<h3 class="text-center mb-3">Login</h3>

<!-- ✅ FLASH MESSAGES GO HERE -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
<form method="POST" action="/">
    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
</form>




<div class="text-end mb-2">
<a href="/forgot-password">Forgot password?</a>
</div>

<hr>

<a href="/login/google" class="btn btn-light w-100 border mb-2">
<img src="https://developers.google.com/identity/images/g-logo.png" width="20">
 Login with Google
</a>

<a href="/login/otp" class="btn btn-outline-secondary w-100 mb-2">
 Login with OTP
</a>

<div class="text-center mt-3">
Don’t have an account? <a href="/signup">Sign up</a>
</div>
 
</div>
</div>

</body>
</html>
