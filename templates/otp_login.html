<!DOCTYPE html>
<html>
<head>
<title>OTP Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="col-md-4">
<div class="card p-4 shadow rounded-4">

<h4 class="text-center mb-3">Login with OTP</h4>

 <form action="/send-otp" method="POST">

            <label class="form-label">Mobile Number</label>
            <input
                type="text"
                name="mobile"
                class="form-control mb-3"
                placeholder="Enter mobile number"
                required
            >

            <button type="submit" class="btn btn-primary w-100">
                Send OTP
            </button>
        </form>
<hr>

<label>Email Address</label>
<input type="email" class="form-control mb-2" placeholder="Enter email">
<a href="/login/otp/verify" class="btn btn-secondary w-100">Send OTP</a>

<a href="/" class="d-block text-center mt-3">Back to Login</a>

</div>
</div>

</body>
</html>
