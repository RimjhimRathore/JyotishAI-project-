<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lo Shu Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 8px;
        }

        .cell {
            background: #1e293b;
            border-radius: 12px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🔢 Lo Shu Grid</h1>

    <div class="grid">

        <!-- Row 1 -->
        <div class="cell">{{ grid[4] }}</div>
        <div class="cell">{{ grid[9] }}</div>
        <div class="cell">{{ grid[2] }}</div>

        <!-- Row 2 -->
        <div class="cell">{{ grid[3] }}</div>
        <div class="cell">{{ grid[5] }}</div>
        <div class="cell">{{ grid[7] }}</div>

        <!-- Row 3 -->
        <div class="cell">{{ grid[8] }}</div>
        <div class="cell">{{ grid[1] }}</div>
        <div class="cell">{{ grid[6] }}</div>

    </div>
</div>

</body>
</html>
