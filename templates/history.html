<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My History — JyotishAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); color: white; min-height: 100vh; }
        h1 { color: gold; text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>
<div class="container py-5">
    <h1>📜 My Saved Kundalis</h1>

    {% if records %}
    <div class="row g-3">
        {% for r in records %}
        <div class="col-md-6">
            <div class="card bg-dark text-light h-100">
                <div class="card-body">
                    <h5 class="text-warning">{{ r.place }}</h5>
                    <p class="mb-1">Born: {{ r.dob }} at {{ r.time }}</p>
                    <p class="text-secondary small">Saved: {{ r.created_at.strftime('%d %b %Y, %H:%M') }}</p>
                    <a href="{{ url_for('view_history', record_id=r.id) }}" class="btn btn-warning btn-sm">Open</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-center">No saved Kundalis yet. Generate one and it will appear here.</p>
    {% endif %}

    <div class="text-center mt-4">
        <a href="{{ url_for('home') }}" class="btn btn-outline-light">← Back to Home</a>
    </div>
</div>
</body>
</html>
